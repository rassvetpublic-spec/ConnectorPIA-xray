name: Контроль качества репозитория

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Governance, структура и hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Проверить обязательную структуру
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f AGENTS.md
          test -f QA_PROTOCOL.md
          test -f SECURITY.md
          test -f docs/GITHUB_WORKFLOW.md
          test -f config/project_views.json
          test -f .github/CODEOWNERS
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/ISSUE_TEMPLATE/config.yml
          test -f .github/ISSUE_TEMPLATE/bug.yml
          test -f .github/ISSUE_TEMPLATE/feature.yml
          test -f .github/ISSUE_TEMPLATE/improvement.yml
          test -f .github/ISSUE_TEMPLATE/feedback.yml
          test -f .github/ISSUE_TEMPLATE/technical_task.yml

      - name: Проверить UTF-8, YAML и JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          text_ext = {'.md', '.txt', '.json', '.yml', '.yaml', '.py', '.ps1', '.js', '.ts', '.toml'}
          for path in Path('.').rglob('*'):
              if '.git' in path.parts or not path.is_file():
                  continue
              if path.suffix.lower() in text_ext or path.name in {'CODEOWNERS', '.gitignore'}:
                  path.read_text(encoding='utf-8')

          for path in list(Path('.github').rglob('*.yml')) + list(Path('.github').rglob('*.yaml')):
              with path.open('r', encoding='utf-8') as f:
                  yaml.safe_load(f)

          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts:
                  continue
              with path.open('r', encoding='utf-8') as f:
                  json.load(f)

          contract = json.loads(Path('config/project_views.json').read_text(encoding='utf-8'))
          expected = [
              '00 — Dashboard',
              '01 — Queue',
              '02 — Active Work',
              '03 — QA Gate',
              '04 — Release Flow',
              '05 — Roadmap',
              '06 — Blocked / Parking',
              '07 — Agent KPI',
          ]
          actual = [v['name'] for v in contract['views']]
          if actual != expected:
              raise SystemExit(f'Неверный контракт Project views: {actual!r}')
          if len(actual) != 8 or len(set(actual)) != 8:
              raise SystemExit('Project должен содержать ровно 8 уникальных канонических представлений')

          print('UTF-8, YAML, JSON и Project contract: PASS')
          PY

      - name: Проверить governance-инварианты
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mtd' AGENTS.md
          grep -q 'mtd' .github/PULL_REQUEST_TEMPLATE.md
          grep -q 'Трассировка критериев готовности' .github/PULL_REQUEST_TEMPLATE.md
          grep -q 'Независимый QA' .github/PULL_REQUEST_TEMPLATE.md
          grep -q 'Project.*представлен' README.md
          grep -q '^name: Обратная связь' .github/ISSUE_TEMPLATE/feedback.yml

      - name: Проверить, что локальные/runtime данные не отслеживаются
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          forbidden_prefixes = (
              'outputs/', 'artifacts/', 'logs/', 'tmp/', 'temp/',
              'auth/', 'cookies/', 'profiles/', 'browser-profile/'
          )
          bad = [p for p in tracked if p.startswith(forbidden_prefixes)]
          if bad:
              raise SystemExit('Запрещённые runtime/auth пути отслеживаются Git: ' + ', '.join(bad))
          print('Tracked-path hygiene: PASS')
          PY

      - name: Проверить очевидные секреты в отслеживаемых текстовых файлах
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          patterns = {
              'AWS access key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'GitHub token': re.compile(r'gh[pousr]_[A-Za-z0-9_]{20,}'),
              'Private key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          }
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          hits = []
          for name in tracked:
              path = Path(name)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      hits.append(f'{label}: {name}')
          if hits:
              raise SystemExit('Обнаружены возможные секреты:\n' + '\n'.join(hits))
          print('Lightweight secret hygiene: PASS')
          PY
